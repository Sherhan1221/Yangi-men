<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yangi Men</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 811px;
      margin: 0 auto;
      line-height: 0;
    }

    .page img {
      display: block;
      width: 100%;
      height: auto;
    }

    .cta {
      position: absolute;
      display: block;
      background: transparent;
      line-height: normal;
      text-decoration: none;
    }

    .cta-top {
      top: 17.7%;
      left: 5.3%;
      width: 38.2%;
      height: 3.3%;
    }

    .cta-bottom {
      top: 90.8%;
      left: 4.8%;
      width: 48.8%;
      height: 3.3%;
    }
  </style>
</head>
<body>
  <main class="page">
    <img src="landing.jpg" alt="Yangi Men transformatsiya dasturi">
    <a class="cta cta-top" href="#join" aria-label="Yangi Men’ga qo‘shilish"></a>
    <a class="cta cta-bottom" href="#join" aria-label="Yangi Men’ga qo‘shilish"></a>
    <span id="join"></span>
  </main>
</body>
</html>
