<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yangi Men</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #ffffff;
}

.page {
    position: relative;
    width: 100%;
    max-width: 811px;
    margin: 0 auto;
    line-height: 0;
}

.page img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0;
    padding: 0;
    border: 0;
}

.cta {
    position: absolute;
    display: block;
    z-index: 100;
    background: transparent;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

/* Верхняя кнопка */
.cta-top {
    left: 5.0%;
    top: 17.35%;
    width: 37.5%;
    height: 3.4%;
}

/* Нижняя кнопка */
.cta-bottom {
    left: 5.0%;
    top: 89.35%;
    width: 49.0%;
    height: 4.0%;
}
</style>
</head>

<body>

<div class="page">

    <img src="landing.jpg" alt="YANGI MEN">

    <a
        class="cta cta-top"
        href="https://t.me/x885600009"
        aria-label="YANGI MEN'GA QO'SHILISH">
    </a>

    <a
        class="cta cta-bottom"
        href="https://t.me/x885600009"
        aria-label="YANGI MEN'GA QO'SHILISH">
    </a>

</div>

</body>
</html>
